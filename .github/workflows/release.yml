---

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only run dry-run, do not publish
        type: boolean
        default: false
      pre_release:
        description: Pre-release tag (e.g. alpha, beta)
        type: string
        required: false
      graduate:
        description: >-
          Space-separated crate names to graduate to 1.0.0
          (e.g. "crate-a crate-b")
        type: string
        required: false
        default: ""
      keep_changesets:
        description: Keep changeset files after release
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Dry run release
        uses: ./.github/actions/release
        with:
          dry-run: "true"
          prerelease: ${{ inputs.pre_release }}
          graduate: ${{ inputs.graduate }}
          keep-changesets: ${{ inputs.keep_changesets && 'true' || 'false' }}

      - name: Execute release
        if: ${{ inputs.dry_run == false }}
        uses: ./.github/actions/release
        with:
          prerelease: ${{ inputs.pre_release }}
          graduate: ${{ inputs.graduate }}
          keep-changesets: ${{ inputs.keep_changesets && 'true' || 'false' }}

      - name: Push release commit and tags
        if: ${{ inputs.dry_run == false }}
        run: |-
          eval "$(ssh-agent -s)"
          echo "${{ secrets.GH_DEPLOY_KEY }}" | ssh-add -
          git remote set-url origin "git@github.com:${{ github.repository }}.git"
          git push --follow-tags

      - name: Trigger downstream workflows in dependency order
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/scripts/dispatch-publish.sh
