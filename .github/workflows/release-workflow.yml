name: Release

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Preview without modifying files"
        type: boolean
        default: false
      version:
        description: "Docker image version tag"
        type: string
        default: "latest"
      git-user-name:
        description: "Git user name for release commits"
        type: string
        default: "github-actions[bot]"
      git-user-email:
        description: "Git email for release commits"
        type: string
        default: "github-actions[bot]@users.noreply.github.com"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GIT_USER_NAME: ${{ inputs.git-user-name }}
      GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      DRY_RUN: ${{ inputs.dry-run }}
      IMAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Run release
        run: |
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          # shellcheck disable=SC2086
          docker run --rm \
            -v "$(pwd):/workspace" -w /workspace \
            -e GIT_AUTHOR_NAME="$GIT_USER_NAME" \
            -e GIT_AUTHOR_EMAIL="$GIT_USER_EMAIL" \
            -e GIT_COMMITTER_NAME="$GIT_USER_NAME" \
            -e GIT_COMMITTER_EMAIL="$GIT_USER_EMAIL" \
            "ghcr.io/lukidoescode/cargo-changeset:${IMAGE_VERSION}" \
            release $DRY_RUN_FLAG

      - name: Push changes and tags
        if: ${{ !inputs.dry-run }}
        run: |
          git push
          git push --tags
