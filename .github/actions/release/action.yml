name: "Release with Changesets"
description: "Run cargo-changeset release to bump versions, update changelogs, and commit"
branding:
  icon: "package"
  color: "blue"

inputs:
  dry-run:
    description: "Preview without modifying files"
    required: false
    default: "false"
  convert:
    description: "Convert pre-release versions to stable"
    required: false
    default: "false"
  no-commit:
    description: "Skip creating a release commit"
    required: false
    default: "false"
  no-tags:
    description: "Skip creating git tags"
    required: false
    default: "false"
  keep-changesets:
    description: "Keep changeset files after release"
    required: false
    default: "false"
  force:
    description: "Force release even without changesets"
    required: false
    default: "false"
  prerelease:
    description: "Pre-release identifiers (space-separated, e.g. 'foo:alpha bar:beta')"
    required: false
    default: ""
  graduate:
    description: "Graduate pre-releases to stable (space-separated crate names, e.g. 'foo bar')"
    required: false
    default: ""
  cargo-changeset-version:
    description: "Docker image tag for cargo-changeset"
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Verify git identity is configured
      shell: bash
      run: |
        if ! git config user.name > /dev/null 2>&1; then
          echo "::error::Git user.name is not configured. Please add a step before this action to set it, e.g.:"
          echo "::error::  git config user.name \"github-actions[bot]\""
          echo "::error::  git config user.email \"github-actions[bot]@users.noreply.github.com\""
          exit 1
        fi
        if ! git config user.email > /dev/null 2>&1; then
          echo "::error::Git user.email is not configured. Please add a step before this action to set it."
          exit 1
        fi

    - name: Run cargo-changeset release
      shell: bash
      env:
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_CONVERT: ${{ inputs.convert }}
        INPUT_NO_COMMIT: ${{ inputs.no-commit }}
        INPUT_NO_TAGS: ${{ inputs.no-tags }}
        INPUT_KEEP_CHANGESETS: ${{ inputs.keep-changesets }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_GRADUATE: ${{ inputs.graduate }}
        INPUT_VERSION: ${{ inputs.cargo-changeset-version }}
      run: |
        FLAGS=""

        if [ "$INPUT_DRY_RUN" = "true" ]; then
          FLAGS="$FLAGS --dry-run"
        fi
        if [ "$INPUT_CONVERT" = "true" ]; then
          FLAGS="$FLAGS --convert"
        fi
        if [ "$INPUT_NO_COMMIT" = "true" ]; then
          FLAGS="$FLAGS --no-commit"
        fi
        if [ "$INPUT_NO_TAGS" = "true" ]; then
          FLAGS="$FLAGS --no-tags"
        fi
        if [ "$INPUT_KEEP_CHANGESETS" = "true" ]; then
          FLAGS="$FLAGS --keep-changesets"
        fi
        if [ "$INPUT_FORCE" = "true" ]; then
          FLAGS="$FLAGS --force"
        fi

        for item in $INPUT_PRERELEASE; do
          FLAGS="$FLAGS --prerelease $item"
        done

        for item in $INPUT_GRADUATE; do
          FLAGS="$FLAGS --graduate $item"
        done

        GIT_USER_NAME="$(git config user.name)"
        GIT_USER_EMAIL="$(git config user.email)"

        # shellcheck disable=SC2086
        docker run --rm \
          -v "$(pwd):/workspace" -w /workspace \
          -e GIT_AUTHOR_NAME="$GIT_USER_NAME" \
          -e GIT_AUTHOR_EMAIL="$GIT_USER_EMAIL" \
          -e GIT_COMMITTER_NAME="$GIT_USER_NAME" \
          -e GIT_COMMITTER_EMAIL="$GIT_USER_EMAIL" \
          "ghcr.io/lukidoescode/cargo-changeset:${INPUT_VERSION}" \
          release $FLAGS
